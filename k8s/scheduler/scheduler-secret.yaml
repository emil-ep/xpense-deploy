# This file defines the Secret structure only.
# Values are NOT stored here — they are injected at install time by install.sh
# using `kubectl create secret --from-literal` which never touches this file.
# ArgoCD tracks the resource exists but never overwrites the data field.
apiVersion: v1
kind: Secret
metadata:
  name: xpense-scheduler-secret
  namespace: xpense
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data: {}
