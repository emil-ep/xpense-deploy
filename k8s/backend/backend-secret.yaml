# This file is a placeholder so ArgoCD knows the Secret exists.
# Values are NOT stored here — they are injected at install time by install.sh
# using `kubectl create secret --from-literal` which never touches this file.
#
# Sync=Skip tells ArgoCD to never apply or overwrite this resource.
# install.sh owns the full lifecycle (create / update).
apiVersion: v1
kind: Secret
metadata:
  name: xpense-backend-secret
  namespace: xpense
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Skip
type: Opaque
data: {}